# Integración continua: en cada push a develop o main y en cada pull request se ejecutan el análisis
# estático y las pruebas automatizadas con cobertura. Las evidencias quedan como artefacto del
# workflow (pestaña Actions) y el resumen de cobertura en la página de la ejecución.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

jobs:
  calidad:
    name: Análisis y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versión de Flutter
        run: flutter --version

      - name: Dependencias
        run: flutter pub get

      - name: Análisis estático
        run: flutter analyze

      - name: Pruebas automatizadas con cobertura
        run: flutter test --coverage --reporter expanded --file-reporter json:test-results.json

      - name: Resumen de cobertura
        if: always()
        run: |
          echo "## Cobertura de líneas" >> "$GITHUB_STEP_SUMMARY"
          bash tool/resumen_cobertura.sh coverage/lcov.info >> "$GITHUB_STEP_SUMMARY" || true

      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-pruebas
          path: |
            test-results.json
            coverage/lcov.info
